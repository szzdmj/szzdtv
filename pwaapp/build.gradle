apply plugin: 'com.android.application'

/**
 * Module-level build.gradle for pwaapp.
 * - Removed module-level repositories (use root project's repositories).
 * - Set explicit compileSdkVersion to avoid missing rootProject.ext values during evaluation.
 * - Uses nanohttpd-webserver 2.3.1 (published on Maven Central).
 *
 * Long-term: move compileSdkVersion and common repo declarations to the root build.gradle/settings.gradle.
 */

android {
    namespace "com.example.tvapp"

    // Explicit compileSdkVersion so this module can be configured even if root ext isn't present
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.szzdmj.szzdtv.pwa"
        // If rootProject.ext.minSdkVersion exists it will be used; otherwise consider setting a concrete value here.
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Use released webserver artifact which contains org.nanohttpd.protocols.http and response classes.
    implementation 'org.nanohttpd:nanohttpd-webserver:2.3.1'
}
