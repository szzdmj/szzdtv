  <p><!DOCTYPE html>

  <style>

  <!-- 轻量日志器（兼容 4.4：不使用 ES6 语法） -->
  <script>
  (function(){
    var start = Date.now();
    function ts(){ return '[' + (Date.now()-start) + 'ms] '; }
    function append(level, msg){
      var pre = document.getElementById('log');
      var line = ts() + level + ': ' + msg;
      try {
        var div = document.createElement('div');
        div.className = level;
        div.textContent = line;
        pre.appendChild(div);
        pre.scrollTop = pre.scrollHeight;
      } catch(e) {}
    }
    window.L = {
      info: function(m){ append('INFO', m); },
      warn: function(m){ append('WARN', m); },
      error:function(m){ append('ERROR',m); }
    };
  })();
  </script>

  <!-- 捕获脚本错误与资源加载失败（兼容 4.4） -->
  <script>
  window.addEventListener('error', function(e){
    try{
      if (e && e.target && e.target.tagName === 'SCRIPT') {
        L.error('Script load failed: ' + (e.target.src || '(inline)'));
      } else {
        var where = (e.filename||'') + (e.lineno? (':'+e.lineno):'') + (e.colno? (':'+e.colno):'');
        L.error('Unhandled error: ' + (e.message||e) + (where? (' @ '+where):''));
      }
    }catch(e2) {}
  }, true);
  </script>

  <!-- 关键外挂（1/2）：模块导出捕获（AMD/CommonJS/UMD），在加载 webjs.js 之前注入 -->
  <script>
  (function(){
    // globalThis 兼容
    if (typeof window.globalThis === 'undefined') {
      try {
        Object.defineProperty(Object.prototype, '__gt__', { get: function(){ return this; }, configurable: true });
        window.globalThis = __gt__;
        delete Object.prototype.__gt__;
      } catch(e) {
        try { window.globalThis = (function(){ return this; })(); } catch(e2){}
      }
    }

    // 捕获 webjs 的导出
    window.__webjsCapture = { amdReturned: null };

    // 备份原对象
    var prevDefine = window.define;
    var prevModule = window.module;
    var prevExports = window.exports;

    // 简易 AMD
    window.define = function(deps, factory){
      if (typeof deps === 'function'){ factory = deps; }
      try {
        window.__webjsCapture.amdReturned = (typeof factory === 'function') ? factory() : factory;
      } catch(e){
        L.error('AMD define 执行失败：' + e);
      }
    };
    window.define.amd = true;

    // 简易 CommonJS
    window.module = { exports: {} };
    window.exports = window.module.exports;

    // 恢复函数
    window.__restoreModuleShims = function(){
      try { window.define  = prevDefine; }  catch(e){}
      try { window.module  = prevModule; }  catch(e){}
      try { window.exports = prevExports; } catch(e){}
    };
  })();
  </script>

  <!-- 关键外挂（2/2）：最小“转译+装载”器（把不兼容 4.4 的语法粗略转为 ES5 并 eval） -->
  <script>
  (function(){
    function replaceAll(s, re, rep){ return s.replace(re, rep); }

    // 极简转译：仅覆盖常见 let/const、箭头函数、export
    function transpileToES5(code){
      try {
        // 1) 去除 BOM
        if (code.charCodeAt(0) === 0xFEFF) code = code.slice(1);

        // 2) 移除常见的模块关键字（export default / export function）
        code = replaceAll(code, /\bexport\s+default\s+/g, 'window.__webjsDefaultExport = ');
        code = replaceAll(code, /\bexport\s+function\s+([A-Za-z_$][\w$]*)\s*\(/g, 'function $1(');

        // 3) let/const -> var（非常粗糙，但对大多数场景可用）
        code = replaceAll(code, /\blet\s+/g, 'var ');
        code = replaceAll(code, /\bconst\s+/g, 'var ');

        // 4) 箭头函数（两类：() => { ... } 与 x => 表达式）
        // 4.1 带块体
        code = replaceAll(code, /(\([^\)]*\))\s*=>\s*\{/g, 'function $1 {');
        code = replaceAll(code, /([A-Za-z_$][\w$]*)\s*=>\s*\{/g, 'function($1) {');
        // 4.2 表达式体（保守：行尾或逗号/分号前的简单表达式）
        code = replaceAll(code, /(\([^\)]*\))\s*=>\s*([^{}\n;]+)(?=[;\n,}])/g, 'function $1 { return $2 }');
        code = replaceAll(code, /([A-Za-z_$][\w$]*)\s*=>\s*([^{}\n;]+)(?=[;\n,}])/g, 'function($1){ return $2 }');

        return code;
      } catch (e) {
        L.error('转译失败：' + e);
        return code;
      }
    }

    function xhrLoadText(url, ok, fail){
      try{
        var x = new XMLHttpRequest();
        if (x.overrideMimeType) x.overrideMimeType('text/plain; charset=utf-8');
        x.onreadystatechange = function(){
          if (x.readyState === 4){
            if (x.status === 0 || (x.status >= 200 && x.status < 300)) ok(x.responseText);
            else fail && fail('HTTP ' + x.status);
          }
        };
        x.open('GET', url, true);
        x.send(null);
      }catch(e){ fail && fail('XHR 异常：' + e); }
    }

    window.__webjsCompatEval = function(url, done){
      xhrLoadText(url, function(src){
        var code = transpileToES5(String(src || ''));
        try {
          // 在全局作用域执行
          (0, eval)(code + '\n//# sourceURL=' + url + '.compat.js');
          L.info('webjs.js 兼容模式执行完成（已尝试 ES5 化）');
          done && done(true);
        } catch(e){
          L.error('兼容模式 eval 失败：' + e);
          done && done(false);
        }
      }, function(err){
        L.error('兼容模式载入失败：' + err);
        done && done(false);
      });
    };
  })();
  </script>
</head>
