apply from: rootProject.ext.sharedModulesConstants
apply plugin: 'com.android.library'

android {
    namespace "com.google.android.exoplayer2.ext.vp9"

    compileSdkVersion rootProject.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion     rootProject.ext.minSdkVersion
        targetSdkVersion  rootProject.ext.targetSdkVersion
        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets.main {
        jniLibs.srcDir 'src/main/libs'
        jni.srcDirs = []
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation platform('com.google.android.exoplayer:exoplayer-bom:' + rootProject.ext.exoplayerVersion)
    implementation 'com.google.android.exoplayer:exoplayer-core'
    implementation 'androidx.annotation:annotation:' + rootProject.ext.appCompatXLibraryVersion
}
