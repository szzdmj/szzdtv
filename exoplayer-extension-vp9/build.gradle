apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

android {
    namespace "com.google.android.exoplayer2.ext.vp9"
    compileSdkVersion project.properties.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion
        targetSdkVersion project.properties.targetSdkVersion
        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets.main {
        jniLibs.srcDir 'src/main/libs'
        jni.srcDirs = []
    }

    testOptions.unitTests.includeAndroidResources = true
}

dependencies {
    // 官方 ExoPlayer VP9 扩充所需核心
    implementation platform('com.google.android.exoplayer:exoplayer-bom:' + exoplayerVersion)
    implementation 'com.google.android.exoplayer:exoplayer-core'

    implementation 'androidx.annotation:annotation:' + appCompatXLibraryVersion
}
