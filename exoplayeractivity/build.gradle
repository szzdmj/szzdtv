apply plugin: 'com.android.library'

android {
    namespace "com.liskovsoft.exoplayeractivity"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "0.7.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "default"
    productFlavors {
        lite {}
        full {}
        kids { matchingFallbacks = ['lite'] }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(":sharedutils")
    implementation project(":common")
    implementation project(":browser")

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.appcompat:appcompat:${rootProject.ext.appCompatXLibraryVersion}"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.collection:collection:1.2.0"

    // Media3 BOM
    implementation platform("androidx.media3:media3-bom:${rootProject.ext.media3BomVersion}")
    implementation "androidx.media3:media3-exoplayer"
    implementation "androidx.media3:media3-ui"
    implementation "androidx.media3:media3-session"
    implementation "androidx.media3:media3-datasource-okhttp"
    // 可选：软件 VP9
    // implementation "androidx.media3:media3-exoplayer-ffmpeg"

    // PreviewSeekBar (Media3)
    implementation "io.github.rubensousa:previewseekbar:2.23.0"
    implementation "io.github.rubensousa:previewseekbar-media3:2.23.0"

    implementation "com.github.bumptech.glide:glide:${rootProject.ext.glideVersion}"
    annotationProcessor "com.github.bumptech.glide:compiler:${rootProject.ext.glideVersion}"

    implementation "androidx.multidex:multidex:${rootProject.ext.multiDexVersion}"
}
