// Removed obsolete: apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

android {
    // FIX: Default interface methods are only supported starting with Android N (--min-api 24)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // publishNonDefault true  // (旧机制, AGP 3.5 已不推荐, 留注释)

    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion     rootProject.ext.minSdkVersion
        targetSdkVersion  rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "0.7.2"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // gradle 4.6 migration: disable dimensions mechanism
    flavorDimensions "default"
    productFlavors {
        lite {}
        full {}
        kids { matchingFallbacks = ['lite'] }
    }

    lintOptions {
        abortOnError true
        lintConfig rootProject.file('lint.xml')
    }
}

dependencies {
    androidTestImplementation('com.android.support.test.espresso:espresso-core:' + rootProject.ext.espressoCoreVersion) {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    testImplementation 'junit:junit:' + rootProject.ext.junitVersion

    implementation project(path: ':sharedutils')
    implementation project(path: ':common')
    implementation project(path: ':browser')

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:' + rootProject.ext.appCompatXLibraryVersion
    implementation 'androidx.constraintlayout:constraintlayout:' + rootProject.ext.constraintLayoutXVersion
    implementation 'androidx.collection:collection:' + rootProject.ext.appCompatXLibraryVersion

    // Amazon ExoPlayer (确保在顶层 ext 中定义 amazonExoplayerVersion)
    api 'com.amazon.android:exoplayer:' + rootProject.ext.amazonExoplayerVersion
    // 如需官方 ExoPlayer: api 'com.google.android.exoplayer:exoplayer:' + rootProject.ext.exoplayerVersion

    implementation 'com.amazon.android:extension-okhttp:' + rootProject.ext.amazonExoplayerVersion
    // 官方扩展替换示例: implementation 'com.google.android.exoplayer:extension-okhttp:' + rootProject.ext.exoplayerVersion

    // PreviewSeekBar (corrected to use rubensousa and correct version)
    implementation 'com.github.rubensousa:previewseekbar:' + rootProject.ext.previewSeekBarDevVersion
    implementation 'com.github.rubensousa:previewseekbar-exoplayer:' + rootProject.ext.previewSeekBarExoDevVersion

    implementation 'com.github.bumptech.glide:glide:' + rootProject.ext.glideVersion
    annotationProcessor 'com.github.bumptech.glide:compiler:' + rootProject.ext.glideVersion
    annotationProcessor 'androidx.annotation:annotation:' + rootProject.ext.appCompatXLibraryVersion

    implementation 'com.android.support:multidex:' + rootProject.ext.multiDexVersion
}