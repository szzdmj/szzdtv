name: Android CI - szzdtv

on:
  push:
    branches: [main, master, main-branch]
  pull_request:
    branches: [main, master, main-branch]
  workflow_dispatch:
    inputs:
      nano_branch:
        description: 'Branch/commit of szzdmj/nanohttpd to fetch index.html from'
        required: false
        default: 'master'
      sz_ref:
        description: 'Branch/commit of szmj0/szmj0.github.io to fetch webjs.js, sw.js, gjw.html from'
        required: false
        default: 'b6977c914a9a1aabafb5bddd6817eea85a2a8738'

permissions:
  contents: read

jobs:
  build-szmjtv:
    name: Build szmjtv (fast, force remote assets)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Clean workspace and module outputs (remove untracked/stale assets)
        shell: bash
        run: |
          set -euo pipefail
          echo "Remove untracked files (safe on CI runner)..."
          git clean -fdx || true
          echo "Run Gradle clean for szmjtv to ensure no stale outputs..."
          ./gradlew :szmjtv:clean --no-daemon || true
          echo "Ensure asset directories exist and show current state (for logs)..."
          mkdir -p szmjtv/src/main/assets pwaapp/src/main/assets
          ls -la szmjtv/src/main/assets || true
          ls -la pwaapp/src/main/assets || true

      - name: Fetch PWA assets (force overwrite from remote; fail if required missing)
        env:
          NBR: ${{ github.event.inputs.nano_branch || 'master' }}
          SZR: ${{ github.event.inputs.sz_ref || 'b6977c914a9a1aabafb5bddd6817eea85a2a8738' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Inputs => NBR=${NBR}, SZR=${SZR}"
          TARGET="szmjtv/src/main/assets"
          mkdir -p "${TARGET}"
          echo "Clean ${TARGET} ..."
          rm -rf "${TARGET:?}"/*

          base_nano="https://raw.githubusercontent.com/szzdmj/nanohttpd/${NBR}/android-asset-webshell/app/src/main/assets"
          base_sz="https://raw.githubusercontent.com/szmj0/szmj0.github.io/${SZR}"

          echo "Resolved URLs:"
          echo "  base_nano=${base_nano}"
          echo "  base_sz=${base_sz}"

          # Download helper: prints HTTP code and sets rc (0 only for 200)
          fetch() {
            local url="$1"
            local out="$2"
            local code
            code=$(curl -fsSL --retry 3 --connect-timeout 15 -w "%{http_code}" -o "${out}" "${url}" || echo "000")
            echo "Fetched ${url} -> ${out} (HTTP ${code})"
            if [ "${code}" = "200" ]; then
              return 0
            else
              return 22
            fi
          }

          # index.html 已弃用（如需强制，可取消注释）
          # fetch "${base_nano}/index.html" "${TARGET}/index.html"; rc_index=$? || true

          # 必需文件
          fetch "${base_sz}/webjs.js" "${TARGET}/webjs.js"; rc_webjs=$? || true
          fetch "${base_sz}/gjw.html" "${TARGET}/gjw.html"; rc_gjw=$? || true
          # 可选文件
          fetch "${base_sz}/sw.js" "${TARGET}/sw.js"; rc_sw=$? || true

          # 失败条件（按需启用 index.html 校验）
          # if [ "${rc_index}" -ne 0 ]; then
          #   echo "::error::index.html missing at ${base_nano}/index.html"
          #   exit 1
          # fi
          if [ "${rc_webjs}" -ne 0 ]; then
            echo "::error::webjs.js missing at ${base_sz}/webjs.js"
            exit 1
          fi
          if [ "${rc_gjw}" -ne 0 ]; then
            echo "::error::gjw.html missing at ${base_sz}/gjw.html"
            exit 1
          fi

          echo "Assets in ${TARGET}:"
          ls -la "${TARGET}" || true

      - name: Build only szmjtv (assemble FullDebug)
        run: ./gradlew :szmjtv:assembleFullDebug --no-configuration-cache --no-daemon --stacktrace --info --warning-mode all

      - name: Collect & rename APKs for upload
        if: success()
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 版本命名：szmjtv-V8.0.<YYYYMMDD><NN>.apk
          DATE=$(date -u +%Y%m%d)
          COUNTER=$(printf "%02d" $((RUN_NUMBER % 100)))
          VERSION="V8.0.${DATE}${COUNTER}"
          echo "Computed version suffix: ${VERSION}"
          OUT_DIR="build/apks_for_upload"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
          found=0
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            baseidx=$((found+1))
            if [ "${found}" -eq 0 ]; then
              newname="szmjtv-${VERSION}.apk"
            else
              newname="szmjtv-${VERSION}-${baseidx}.apk"
            fi
            echo "Copying '$apk' -> '${OUT_DIR}/${newname}'"
            cp "$apk" "${OUT_DIR}/${newname}"
            found=$((found+1))
          done < <(find . -type f -name '*.apk' -print)
          if [ "${found}" -eq 0 ]; then
            echo "::warning::No APKs found to upload (checked find . -name '*.apk')"
          else
            echo "Prepared ${found} APK(s) for upload in ${OUT_DIR}"
            ls -la "${OUT_DIR}"
          fi

      - name: Upload build artifacts (apk)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: szmjtv-apks
          path: |
            build/apks_for_upload/**/*.apk
