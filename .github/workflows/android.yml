1| name: Android CI - szzdtv (local PWA index from nanohttpd + webjs/sw from szmj0, no id-shim)
2| 
3| on:
4|   push:
5|     branches: [ "master", "main-branch" ]
6|   pull_request:
7|   workflow_dispatch:
8|     inputs:
9|       nano_branch:
10|         description: 'Branch/commit of szzdmj/nanohttpd to fetch index.html from'
11|         required: false
12|         default: 'master'
13|       sz_ref:
14|         description: 'Branch/commit of szmj0/szmj0.github.io to fetch webjs.js & sw.js from'
15|         required: false
16|         default: 'b6977c914a9a1aabafb5bddd6817eea85a2a8738'
17| 
18| jobs:
19|   build:
20|     runs-on: ubuntu-latest
21| 
22|     steps:
23|       - name: Checkout
24|         uses: actions/checkout@v4
25| 
26|       - name: Set up JDK 17 (for sdkmanager)
27|         uses: actions/setup-java@v4
28|         with:
29|           distribution: temurin
30|           java-version: '17'
31| 
32|       - name: Configure Android SDK (API 28) and accept licenses
33|         shell: bash
34|         run: |
35|           set -euo pipefail
36|           ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
37|           echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
38|           echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
39|           if [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
40|             SDKM="${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"
41|           else
42|             SDKM="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
43|           fi
44|           yes | "${SDKM}" --licenses >/dev/null 2>&1 || true
45|           "${SDKM}" "platform-tools" "build-tools;28.0.3" "platforms;android-28"
46| 
47|       - name: Prepare PWA assets (index.html from szzdmj/nanohttpd; webjs.js & sw.js from szmj0/szmj0.github.io)
48|         env:
49|           NBR: ${{ github.event.inputs.nano_branch || 'master' }}
50|           SZR: ${{ github.event.inputs.sz_ref || 'b6977c914a9a1aabafb5bddd6817eea85a2a8738' }}
51|         shell: bash
52|         run: |
53|           set -euo pipefail
54|           A="smartyoutubetv/src/main/assets"
55|           mkdir -p "$A"
56|           echo "Fetching index.html from szzdmj/nanohttpd@${NBR}"
57|           base_nano="https://raw.githubusercontent.com/szzdmj/nanohttpd/${NBR}/android-asset-webshell/app/src/main/assets"
58|           curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/index.html" "${base_nano}/index.html"
59|           echo "Fetching webjs.js & sw.js from szmj0/szmj0.github.io@${SZR}"
60|           base_sz="https://raw.githubusercontent.com/szmj0/szmj0.github.io/${SZR}"
61|           curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/webjs.js" "${base_sz}/webjs.js"
62|           curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/sw.js"     "${base_sz}/sw.js"
63|           echo "Assets present in ${A}:"
64|           ls -l "${A}"
65|           echo "index.html head:"
66|           sed -n '1,40p' "${A}/index.html" || true
67| 
68|       - name: Set up JDK 11 (for Gradle/AGP 3.5.0)
69|         uses: actions/setup-java@v4
70|         with:
71|           distribution: temurin
72|           java-version: '11'
73| 
74|       - name: List projects
75|         uses: gradle/gradle-build-action@v3
76|         with:
77|           gradle-version: 5.4.1
78|           arguments: projects --no-daemon --info
79| 
80|       - name: List tasks in :smartyoutubetv
81|         uses: gradle/gradle-build-action@v3
82|         with:
83|           gradle-version: 5.4.1
84|           arguments: :smartyoutubetv:tasks --all --no-daemon --info
85| 
86|       - name: Build Debug (:smartyoutubetv orig flavor)
87|         uses: gradle/gradle-build-action@v3
88|         with:
89|           gradle-version: 5.4.1
90|           arguments: :smartyoutubetv:assembleOrigDebug --stacktrace --info --no-daemon
91| 
92|       - name: Upload debug APK
93|         uses: actions/upload-artifact@v4
94|         with:
95|           name: szzdtv-debug-apk
96|           path: smartyoutubetv/build/outputs/apk/orig/*.apk
97| 
98|       - name: Build Release (:smartyoutubetv orig flavor)
99|         uses: gradle/gradle-build-action@v3
100|         with:
101|           gradle-version: 5.4.1
102|         arguments: :smartyoutubetv:assembleOrigRelease --stacktrace --info --no-daemon
103| 
104|       - name: Upload release APK
105|         uses: actions/upload-artifact@v4
106|         with:
107|           name: szzdtv-release-apk
108|           path: smartyoutubetv/build/outputs/apk/orig/*.apk
109| 
