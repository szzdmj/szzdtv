name: Android CI - szzdtv

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean Gradle caches (optional, safe)
        run: |
          rm -rf $HOME/.gradle/caches || true
          rm -rf $HOME/.gradle/script-security || true

      - name: Build (assemble)
        run: ./gradlew --no-daemon clean assemble
