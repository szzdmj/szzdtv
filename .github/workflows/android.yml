      - name: Collect APKs (debug)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for APKs under repo (for upload)..."
          # List all potential apk locations for debugging
          find . -type f -name '*.apk' -print || true
          echo "Also list build outputs directories:"
          du -h --max-depth=3 */build/outputs 2>/dev/null || true
          # Prepare upload dir
          OUT_DIR="build/apks_for_upload"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          # Copy all found apks into OUT_DIR preserving names
          found=0
          while IFS= read -r apk; do
            cp "$apk" "$OUT_DIR/$(basename "$apk")"
            found=$((found+1))
          done < <(find . -type f -name '*.apk' -print)
          if [ "$found" -eq 0 ]; then
            echo "::warning::No APKs found to upload."
          else
            echo "Prepared $found APK(s) for upload in $OUT_DIR"
            ls -la "$OUT_DIR"
          fi

      - name: Upload build artifacts (apk)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: szmjtv-apks
          path: |
            build/apks_for_upload/**/*.apk
