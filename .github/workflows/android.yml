name: Android CI - szzdtv (merged, auto-refresh Gradle Wrapper 5.4.1)

on:
  push:
    branches: [ "main", "master", "main-branch" ]
  pull_request:
    branches: [ "main", "master", "main-branch" ]
  workflow_dispatch:
    inputs:
      nano_branch:
        description: 'Branch/commit of szzdmj/nanohttpd to fetch index.html from'
        required: false
        default: 'master'
      sz_ref:
        description: 'Branch/commit of szmj0/szmj0.github.io to fetch webjs.js & sw.js from'
        required: false
        default: 'b6977c914a9a1aabafb5bddd6817eea85a2a8738'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs='-Xmx2g -Dfile.encoding=UTF-8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install isolated Android SDK (API 28 only) and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          pushd "${ANDROID_SDK_ROOT}/cmdline-tools" >/dev/null
          CTL_ZIP="commandlinetools-linux-11076708_latest.zip"
          URL_BASE="https://dl.google.com/android/repository"
          if ! curl -fsSL --retry 3 -o cmdline-tools.zip "${URL_BASE}/${CTL_ZIP}"; then
            curl -fsSL --retry 3 -o cmdline-tools.zip "${URL_BASE}/commandlinetools-linux-9477386_latest.zip"
          fi
          unzip -q cmdline-tools.zip
          rm -f cmdline-tools.zip
          if [ -d "cmdline-tools" ]; then
            mv cmdline-tools latest
          fi
          popd >/dev/null
          SDKM="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKM}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          "${SDKM}" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "build-tools;28.0.3" "platforms;android-28"

      - name: Prepare PWA assets (index.html, webjs.js, sw.js)
        env:
          NBR: ${{ github.event.inputs.nano_branch || 'master' }}
          SZR: ${{ github.event.inputs.sz_ref || 'b6977c914a9a1aabafb5bddd6817eea85a2a8738' }}
        shell: bash
        run: |
          set -euo pipefail
          A="smartyoutubetv/src/main/assets"
          mkdir -p "$A"
          echo "Fetching index.html from szzdmj/nanohttpd@${NBR}"
          base_nano="https://raw.githubusercontent.com/szzdmj/nanohttpd/${NBR}/android-asset-webshell/app/src/main/assets"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/index.html" "${base_nano}/index.html"
          echo "Fetching webjs.js & sw.js from szmj0/szmj0.github.io@${SZR}"
          base_sz="https://raw.githubusercontent.com/szmj0/szmj0.github.io/${SZR}"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/webjs.js" "${base_sz}/webjs.js"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/sw.js"     "${base_sz}/sw.js"
          echo "Assets present in ${A}:"
          ls -l "${A}"
          echo "index.html head:"
          sed -n '1,40p' "${A}/index.html" || true

      - name: Refresh Gradle Wrapper to 5.4.1 (download jar + scripts)
        shell: bash
        run: |
          set -euo pipefail
          WRAP_DIR="gradle/wrapper"
          mkdir -p "${WRAP_DIR}"

          echo "Writing gradle-wrapper.properties (no indentation)."
          cat > "${WRAP_DIR}/gradle-wrapper.properties" <<EOF
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https://services.gradle.org/distributions/gradle-5.4.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

          echo "Downloading clean gradlew scripts from Gradle v5.4.1 tag."
          curl -fsSL --retry 3 -o gradlew     https://raw.githubusercontent.com/gradle/gradle/v5.4.1/gradlew
          curl -fsSL --retry 3 -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v5.4.1/gradlew.bat
          chmod +x gradlew

          echo "Downloading Gradle 5.4.1 distribution..."
          TMP_DIR="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${TMP_DIR}/gradle.zip" "https://services.gradle.org/distributions/gradle-5.4.1-bin.zip"
          unzip -q "${TMP_DIR}/gradle.zip" -d "${TMP_DIR}"

          # First look in lib/ (Gradle 5.x layout)
          WRAP_JAR="$(find "${TMP_DIR}" -type f -path '*/lib/gradle-wrapper-*.jar' -print -quit)"
          # Fallback for newer distributions that may put it under plugins (not needed for 5.4.1 but future-proof)
          if [ -z "${WRAP_JAR}" ] || [ ! -f "${WRAP_JAR}" ]; then
            WRAP_JAR="$(find "${TMP_DIR}" -type f -path '*/lib/plugins/gradle-wrapper-*.jar' -print -quit)"
          fi

          if [ -z "${WRAP_JAR}" ] || [ ! -f "${WRAP_JAR}" ]; then
            echo "Wrapper jar not found. Listing candidate files (depth 3) for debugging:"
            find "${TMP_DIR}" -maxdepth 3 -type f | sed 's/^/  /'
            exit 1
          fi

          echo "Found wrapper jar: ${WRAP_JAR}"
          cp -f "${WRAP_JAR}" "${WRAP_DIR}/gradle-wrapper.jar"
          echo "Gradle wrapper refreshed."

      - name: Make gradlew executable
        shell: bash
        run: chmod +x gradlew

      - name: Set up JDK 11 (legacy Gradle/AGP build usage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify Gradle version
        shell: bash
        run: ./gradlew -v || true

      - name: List projects
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: projects --no-daemon --info

      - name: List tasks in :smartyoutubetv
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: :smartyoutubetv:tasks --all --no-daemon --info

      - name: Build Debug (:smartyoutubetv) and save logs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :smartyoutubetv:assembleDebug --stacktrace --info --no-daemon > build_log_debug.txt 2>&1 || true
          echo "Debug build finished (possibly with errors), log saved."

      - name: Upload debug build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-debug
          path: build_log_debug.txt

      - name: Unit tests and save logs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace --info --no-daemon > test_log.txt 2>&1 || true
          echo "Unit tests finished, log saved."

      - name: Upload unit test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-debug
          path: test_log.txt

      - name: Lint and save logs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew lintDebug --stacktrace --info --no-daemon > lint_log.txt 2>&1 || true
          echo "Lint finished, log saved."

      - name: Upload lint logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log-debug
          path: lint_log.txt

      - name: Upload debug APK (if successful)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: szzdtv-debug-apk
          path: smartyoutubetv/build/outputs/apk/debug/*.apk

      - name: Build Release (:smartyoutubetv) and save logs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :smartyoutubetv:assembleRelease --stacktrace --info --no-daemon > build_log_release.txt 2>&1 || true
          echo "Release build finished (possibly with errors), log saved."

      - name: Upload release build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-release
          path: build_log_release.txt

      - name: Upload release APK (if successful)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: szzdtv-release-apk
          path: smartyoutubetv/build/outputs/apk/release/*.apk

      - name: Upload legacy app module APK (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
