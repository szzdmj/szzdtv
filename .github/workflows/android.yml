name: "Android CI - szzdtv (legacy stack with auto wrapper and tightened trimmed logs)"

on:
  push:
    branches: [ "main", "master", "main-branch" ]
  pull_request:
    branches: [ "main", "master", "main-branch" ]
  workflow_dispatch:
    inputs:
      nano_branch:
        description: "Branch/commit of szzdmj/nanohttpd to fetch index.html from"
        required: false
        default: "master"
      sz_ref:
        description: "Branch/commit of szmj0/szmj0.github.io to fetch webjs.js & sw.js from"
        required: false
        default: "b6977c914a9a1aabafb5bddd6817eea85a2a8738"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs='-Xmx2g -Dfile.encoding=UTF-8'
      ERROR_BLOCK_LIMIT: "200"
      TAIL_CONTEXT: "200"
      LOG_SIZE_THRESHOLD: "512000"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up JDK 17 (for sdkmanager)"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "Install isolated Android SDK (API 34 only) and accept licenses"
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          pushd "${ANDROID_SDK_ROOT}/cmdline-tools" >/dev/null
          CTL_ZIP="commandlinetools-linux-11076708_latest.zip"
          URL_BASE="https://dl.google.com/android/repository"
          if ! curl -fsSL --retry 3 -o cmdline-tools.zip "${URL_BASE}/${CTL_ZIP}"; then
            curl -fsSL --retry 3 -o cmdline-tools.zip "${URL_BASE}/commandlinetools-linux-9477386_latest.zip"
          fi
          unzip -q cmdline-tools.zip
          rm -f cmdline-tools.zip
          if [ -d "cmdline-tools" ]; then
            mv cmdline-tools latest
          fi
          popd >/dev/null
          SDKM="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKM}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          "${SDKM}" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: "Prepare PWA assets (index.html, webjs.js, sw.js)"
        shell: bash
        run: |
          set -euo pipefail
          NBR="${{ github.event.inputs.nano_branch || 'master' }}"
          SZR="${{ github.event.inputs.sz_ref || 'b6977c914a9a1aabafb5bddd6817eea85a2a8738' }}"
          A="smartyoutubetv/src/main/assets"
          mkdir -p "$A"
          echo "Fetching index.html from szzdmj/nanohttpd@${NBR}"
          base_nano="https://raw.githubusercontent.com/szzdmj/nanohttpd/${NBR}/android-asset-webshell/app/src/main/assets"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/index.html" "${base_nano}/index.html"
          echo "Fetching webjs.js & sw.js from szmj0/szmj0.github.io@${SZR}"
          base_sz="https://raw.githubusercontent.com/szmj0/szmj0.github.io/${SZR}"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/webjs.js" "${base_sz}/webjs.js"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/sw.js"     "${base_sz}/sw.js"
          echo "Assets present in ${A}:"
          ls -l "${A}"
          echo "index.html head:"
          sed -n '1,40p' "${A}/index.html" || true

      - name: Setup Gradle (use wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false

      # Run a full build early with explicit flags and capture logs, so we always get details.
      - name: Build (full logs; disable configuration cache for debugging)
        shell: bash
        continue-on-error: true
        run: |
          set -eo pipefail
          mkdir -p build-logs
          ./gradlew --version | tee build-logs/gradle-version.txt
          ./gradlew --no-configuration-cache clean build --stacktrace --info --warning-mode all | tee build-logs/build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: build-logs/

      # Make discovery steps non-fatal and verbose
      - name: List all tasks (root)
        uses: gradle/gradle-build-action@v3
        continue-on-error: true
        with:
          arguments: tasks --all --no-daemon --info --stacktrace --no-configuration-cache

      - name: List smartyoutubetv tasks
        uses: gradle/gradle-build-action@v3
        continue-on-error: true
        with:
          arguments: :smartyoutubetv:tasks --all --no-daemon --info --stacktrace --no-configuration-cache

      - name: Build
        run: |
          ./gradlew --version
          ./gradlew clean build -S

      - name: "Make gradlew executable"
        if: always()
        shell: bash
        run: chmod +x gradlew

      - name: "List projects"
        if: always()
        shell: bash
        run: ./gradlew projects --no-daemon --info --stacktrace --no-configuration-cache

      - name: "List tasks in :smartyoutubetv"
        if: always()
        shell: bash
        run: ./gradlew :smartyoutubetv:tasks --all --no-daemon --info --stacktrace --no-configuration-cache

      - name: "Build Debug (:smartyoutubetv) and save logs"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :smartyoutubetv:assembleDebug --stacktrace --info --no-daemon --no-configuration-cache > build_log_debug.txt 2>&1 || true
          echo "Debug build finished (possibly with errors), log saved."

      - name: "Unit tests and save logs"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace --info --no-daemon --no-configuration-cache > test_log.txt 2>&1 || true
          echo "Unit tests finished, log saved."

      - name: "Lint and save logs"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew lintDebug --stacktrace --info --no-daemon --no-configuration-cache > lint_log.txt 2>&1 || true
          echo "Lint finished, log saved."

      - name: "Build Release (:smartyoutubetv) and save logs"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :smartyoutubetv:assembleRelease --stacktrace --info --no-daemon --no-configuration-cache > build_log_release.txt 2>&1 || true
          echo "Release build finished (possibly with errors), log saved."

      - name: "Upload logs (original)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-original
          path: |
            build_log_debug.txt
            test_log.txt
            lint_log.txt
            build_log_release.txt

      - name: "Upload logs (tight-trimmed)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-trimmed-tight
          path: |
            build_log_debug_trimmed.txt
            test_log_trimmed.txt
            lint_log_trimmed.txt
            build_log_release_trimmed.txt
