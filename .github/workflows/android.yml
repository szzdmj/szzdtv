name: Android CI - szzdtv

on:
  push:
    branches: [main, master, main-branch]
  pull_request:
    branches: [main, master, main-branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java & Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Run a quick assemble to expose failures directly in the job log (no tee/upload)
      - name: Build (refresh - show failures in job log)
        run: |
          set -eo pipefail
          ./gradlew --refresh-dependencies assembleDebug --stacktrace --info --warning-mode all

      - name: Sync Android SDK (minimal)
        run: |
          sdkmanager --version || true
          echo "Using pre-installed Android SDK components."

      - name: Prepare PWA assets
        run: |
          set -euo pipefail
          ASSETS="smartyoutubetv/src/main/assets"
          mkdir -p "$ASSETS"
          curl -fsSL --retry 3 -o "$ASSETS/index.html" "https://raw.githubusercontent.com/szzdmj/nanohttpd/master/android-asset-webshell/app/src/main/assets/index.html"
          curl -fsSL --retry 3 -o "$ASSETS/webjs.js" "https://raw.githubusercontent.com/szmj0/szmj0.github.io/main/webjs.js"
          curl -fsSL --retry 3 -o "$ASSETS/sw.js" "https://raw.githubusercontent.com/szmj0/szmj0.github.io/main/sw.js"

      - name: Build / Test / Lint (single unified step)
        run: |
          set -e
          ./gradlew --version
          ./gradlew clean assembleDebug testDebugUnitTest lintDebug --stacktrace --info
        continue-on-error: true

      - name: Build Release (optional)
        run: |
          set -e
          ./gradlew assembleRelease --stacktrace --info
        continue-on-error: true
