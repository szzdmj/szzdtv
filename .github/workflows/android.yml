name: Android CI - szzdtv (local PWA index from nanohttpd + webjs/sw from szmj0, no id-shim)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      nano_branch:
        description: 'Branch/commit of szzdmj/nanohttpd to fetch index.html from'
        required: false
        default: 'master'
      sz_ref:
        description: 'Branch/commit of szmj0/szmj0.github.io to fetch webjs.js & sw.js from'
        required: false
        default: 'b6977c914a9a1aabafb5bddd6817eea85a2a8738'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (API 28) and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          if [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
            SDKM="${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"
          else
            SDKM="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "${SDKM}" --licenses >/dev/null 2>&1 || true
          "${SDKM}" "platform-tools" "build-tools;28.0.3" "platforms;android-28"

      - name: Prepare PWA assets (index.html from szzdmj/nanohttpd; webjs.js & sw.js from szmj0/szmj0.github.io)
        env:
          NBR: ${{ github.event.inputs.nano_branch || 'master' }}
          SZR: ${{ github.event.inputs.sz_ref || 'b6977c914a9a1aabafb5bddd6817eea85a2a8738' }}
        shell: bash
        run: |
          set -euo pipefail
          A="smartyoutubetv/src/main/assets"
          mkdir -p "$A"
          echo "Fetching index.html from szzdmj/nanohttpd@${NBR}"
          base_nano="https://raw.githubusercontent.com/szzdmj/nanohttpd/${NBR}/android-asset-webshell/app/src/main/assets"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/index.html" "${base_nano}/index.html"
          echo "Fetching webjs.js & sw.js from szmj0/szmj0.github.io@${SZR}"
          base_sz="https://raw.githubusercontent.com/szmj0/szmj0.github.io/${SZR}"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/webjs.js" "${base_sz}/webjs.js"
          curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/sw.js"     "${base_sz}/sw.js"
          echo "Assets present in ${A}:"
          ls -l "${A}"
          echo "index.html head:"
          sed -n '1,40p' "${A}/index.html" || true

      - name: Set up JDK 8 (for Gradle/AGP 3.5.0)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Diagnose Gradle project & constants
        shell: bash
        run: |
          set -euo pipefail
          echo "==== build.gradle (constants grep) ===="
          grep -E 'appCompatXLibraryVersion|okhttpVersion|espressoCoreVersion|robolectricVersion|xwalkSharedLibraryVersion' -n build.gradle || true
          echo "==== common/build.gradle head ===="
          sed -n '1,80p' common/build.gradle || true
      - name: List projects
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: projects --no-daemon --info

      - name: List tasks in :smartyoutubetv
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: :smartyoutubetv:tasks --all --no-daemon --info

      - name: List tasks in :browser
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: :browser:tasks --all --no-daemon --info
# Add an isolation build step just for :browser before full app build
# (Keep previous content; only showing added diagnostic steps)

# Insert after "Diagnose Gradle project & constants" and before ":smartyoutubetv:assembleDebug":
      - name: Build browser (isolation)
        uses: gradle/gradle-build-action@v3
        continue-on-error: true
        with:
          gradle-version: 5.4.1
          arguments: :browser:assembleDebug --stacktrace --info --no-daemon

      - name: Upload browser build logs (if failed)
        if: failure()
        shell: bash
        run: |
          echo "Browser module failed; diagnostic output already printed above."
      - name: Build Debug (:smartyoutubetv)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: :smartyoutubetv:assembleDebug --stacktrace --info --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: szzdtv-debug-apk
          path: smartyoutubetv/build/outputs/apk/debug/*.apk

      - name: Build Release (:smartyoutubetv)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: :smartyoutubetv:assembleRelease --stacktrace --info --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: szzdtv-release-apk
          path: smartyoutubetv/build/outputs/apk/release/*.apk
