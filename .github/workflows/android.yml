name: Android CI - szzdtv (copy PWA assets from nanohttpd, no id-shim)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      nano_branch:
        description: 'Branch of szzdmj/nanohttpd to fetch assets from'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 JDK 17 运行 sdkmanager（cmdline-tools/newer 需要）
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (API 28) and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          # 优先使用老 tools/bin/sdkmanager 以兼容 JDK 8 构建期；此步仅安装组件
          if [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
            SDKM="${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"
          else
            SDKM="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "${SDKM}" --licenses >/dev/null 2>&1 || true
          "${SDKM}" "platform-tools" "build-tools;28.0.3" "platforms;android-28"

      - name: Prepare PWA assets from szzdmj/nanohttpd (index.html + webjs.js + sw.js)
        env:
          NBR: ${{ github.event.inputs.nano_branch || 'master' }}
        shell: bash
        run: |
          set -euo pipefail
          A="smartyoutubetv/src/main/assets"
          mkdir -p "$A"

          base="https://raw.githubusercontent.com/szzdmj/nanohttpd/${NBR}/android-asset-webshell/app/src/main/assets"
          for f in index.html webjs.js sw.js; do
            echo "Fetching ${base}/${f}"
            curl -fsSL --retry 3 --connect-timeout 10 -o "${A}/${f}" "${base}/${f}"
          done

          echo "Assets present in ${A}:"
          ls -l "$A"
          echo "index.html head:"
          sed -n '1,40p' "$A/index.html" || true

      # 切回 JDK 8 以匹配 AGP 3.5.0 + Gradle 5.4.1
      - name: Set up JDK 8 (for build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Print Gradle/Android versions
        shell: bash
        run: |
          echo "JAVA_HOME=${JAVA_HOME}"
          java -version
          echo "Top-level build.gradle (expect AGP 3.5.0, compileSdk 28):"
          sed -n '1,120p' build.gradle || true

      # 使用 Gradle 5.4.1（与 AGP 3.5.0 兼容）
      - name: Build Debug (:smartyoutubetv)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: :smartyoutubetv:assembleDebug --stacktrace --info --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: szzdtv-debug-apk
          path: smartyoutubetv/build/outputs/apk/debug/*.apk

      - name: Build Release (:smartyoutubetv)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 5.4.1
          arguments: :smartyoutubetv:assembleRelease --stacktrace --info --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: szzdtv-release-apk
          path: smartyoutubetv/build/outputs/apk/release/*.apk
