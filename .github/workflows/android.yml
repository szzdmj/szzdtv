name: Android CI - szzdtv

on:
  push:
    branches: [main, master, main-branch]
  pull_request:
    branches: [main, master, main-branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smartyoutubetv:
    name: Build smartyoutubetv (fast)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-
      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Clean workspace (remove untracked files) and module build outputs
        # git clean -fdx removes untracked files (including previously fetched assets),
        # then run Gradle clean for the module to ensure no stale build outputs remain.
        shell: bash
        run: |
          set -euo pipefail
          echo "Git cleaning workspace (remove untracked files)..."
          git clean -fdx || true
          echo "Gradle clean :smartyoutubetv ..."
          ./gradlew :smartyoutubetv:clean --no-daemon || true
          echo "Ensure assets directories exist:"
          mkdir -p smartyoutubetv/src/main/assets pwaapp/src/main/assets
          ls -la smartyoutubetv/src/main/assets || true
          ls -la pwaapp/src/main/assets || true

      - name: Prepare PWA assets (index.html, webjs.js, sw.js)
        env:
          NBR: ${{ github.event.inputs.nano_branch || 'master' }}
          SZR: ${{ github.event.inputs.sz_ref || 'b6977c914a9a1aabafb5bddd6817eea85a2a8738' }}
        shell: bash
        run: |
          set -euo pipefail
          A="smartyoutubetv/src/main/assets"
          mkdir -p "$A"
          echo "Fetching index.html from szzdmj/nanohttpd@${NBR}"
          base_nano="https://raw.githubusercontent.com/szzdmj/nanohttpd/${NBR}/android-asset-webshell/app/src/main/assets"
          if curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/index.html" "${base_nano}/index.html"; then
            echo "Fetched index.html from ${base_nano}/index.html"
          else
            echo "Warning: failed to fetch index.html from ${base_nano}/index.html (continuing; local assets may already exist)"
          fi
          echo "Fetching webjs.js & sw.js from szmj0/szmj0.github.io@${SZR}"
          base_sz="https://raw.githubusercontent.com/szmj0/szmj0.github.io/${SZR}"
          if curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/webjs.js" "${base_sz}/webjs.js"; then
            echo "Fetched webjs.js"
          else
            echo "Warning: failed to fetch webjs.js from ${base_sz}/webjs.js (continuing; will try asset fallback)"
          fi
          if curl -fsSL --retry 3 --connect-timeout 15 -o "${A}/sw.js"     "${base_sz}/sw.js"; then
            echo "Fetched sw.js"
          else
            echo "Warning: failed to fetch sw.js from ${base_sz}/sw.js (continuing; will try asset fallback)"
          fi
          echo "Assets present in ${A}:"
          ls -l "${A}" || true
          echo "index.html head:"
          sed -n '1,40p' "${A}/index.html" || true

      - name: Build only smartyoutubetv (assemble FullDebug)
        run: ./gradlew :smartyoutubetv:assembleFullDebug --no-configuration-cache --no-daemon --stacktrace --info --warning-mode all

      - name: Upload build artifacts (apk)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smartyoutubetv-apks
          path: |
            smartyoutubetv/build/outputs/**/*.apk
