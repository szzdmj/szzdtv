name: Android CI - szzdtv

on:
  push:
    branches: [ main-branch ]
  pull_request:
    branches: [ main-branch ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Gradle build with detailed logs
        # Capture full output to gradle-build.log (includes --info and --stacktrace)
        run: |
          ./gradlew --no-daemon clean assemble --info --stacktrace > gradle-build.log 2>&1 || true

      - name: Upload build log artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
