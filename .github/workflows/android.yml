name: Android CI - szzdtv

on:
  push:
    branches: [main, master, main-branch]
  pull_request:
    branches: [main, master, main-branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smartyoutubetv:
    name: Build smartyoutubetv (fast)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Build only smartyoutubetv (assemble FullDebug)
        run: ./gradlew :smartyoutubetv:assembleFullDebug --no-configuration-cache --no-daemon --stacktrace --info --warning-mode all

      - name: Upload build artifacts (apk)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smartyoutubetv-apks
          path: |
            smartyoutubetv/build/outputs/**/*.apk
