name: Android CI - Gradle 8.x + Java 17 (full logs)

on:
  push:
    branches: [ main-branch, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle (uses project wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false

      - name: Build (full logs; disable configuration cache for debugging)
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build-logs
          ./gradlew --version | tee build-logs/gradle-version.txt
          # 關閉組態快取，輸出完整錯誤與堆疊
          ./gradlew --no-configuration-cache clean build --stacktrace --info --warning-mode all | tee build-logs/build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: build-logs/

      - name: Upload configuration cache report (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configuration-cache-report
          path: build/reports/configuration-cache/**
          if-no-files-found: ignore
