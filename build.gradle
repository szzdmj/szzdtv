// Top-level build file

buildscript {
    repositories {
        // 重要：Google 优先，保证 AndroidX/Jetifier 等解析正确
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://maven.google.com/'; name 'Google' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'
    }
    ext {
        compileSdkVersion = 28
        buildToolsVersion = "28.0.3"
        minSdkVersion = 14
        targetSdkVersion = 26
    }
}

ext {
    // AndroidX / Support
    appCompatXLibraryVersion = '1.1.0'
    materialLibraryVersion   = '1.1.0'
    multiDexVersion          = '1.0.3'

    // Test
    junitVersion        = '4.12'
    espressoCoreVersion = '3.0.2'
    robolectricVersion  = '4.3.1'
    assertJVersion      = '3.12.2'
    commonsIOVersion    = '2.6'

    // Network / Util
    okhttpVersion       = '3.12.13'
    ottoVersion         = '1.3.8'
    dnsjavaVersion      = '3.5.2'
    gsonVersion         = '2.8.9'
    diskLruCacheVersion = '2.0.2'
    apacheCommonsLangVersion = '3.9'
    jsonPathVersion     = '2.4.0'

    // Crosswalk
    xwalkSharedLibraryVersion = '23.53.589.4'
    xwalkCoreLibraryVersion   = '23.53.589.4'

    // App / Exo
    nanoHttpdVersion         = '2.3.1'
    voiceOverlayVersion      = '1.0.0'
    constraintLayoutXVersion = '1.1.3'
    firebaseCrashlyticsVersion = '17.0.0'

    // ExoPlayer family
    amazonExoplayerVersion      = '2.12.1'
    exoplayerVersion            = '2.12.1'

    // PreviewSeekBar / Glide
    previewSeekBarDevVersion    = 'v3.2.2'
    previewSeekBarExoDevVersion = 'v3.2.2'
    glideVersion                = '4.11.0'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://maven.google.com/'; name 'Google' }
        maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
        maven { url 'https://jitpack.io' }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

task clean(type: Delete) { delete rootProject.buildDir }
