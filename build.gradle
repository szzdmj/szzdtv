// Top-level build file configured for modern toolchain (AGP 8.5.0, Kotlin 1.9.22).
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        // Android Gradle Plugin matching README (modern)
        classpath 'com.android.tools.build:gradle:8.5.0'
        // Kotlin gradle plugin (if Kotlin is used anywhere)
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
    }
}

ext {
    // Project SDK versions (README / modern)
    compileSdkVersion = 34
    targetSdkVersion = 34
    minSdkVersion = 22
    buildToolsVersion = "34.0.0"

    // Dependency versions (centralized defaults; SharedModules/constants.gradle may override)
    espressoCoreVersion = '3.5.1'
    junitVersion = '4.13.2'
    robolectricVersion = '4.10'
    appCompatXLibraryVersion = '1.6.1'
    okhttpVersion = '4.9.3'
    ottoVersion = '1.3.8'
    dnsjavaVersion = '3.4.2'
    gsonVersion = '2.10.1'
    multiDexVersion = '2.0.1'
    diskLruCacheVersion = '2.0.2'

    // Crosswalk (keep defaults but you can remove Crosswalk deps if not used)
    xwalkSharedLibraryVersion = '23.53.589.4'
    xwalkCoreLibraryVersion = '23.53.589.4'

    // Media3 version (earlier discussion)
    media3Version = '1.4.0'
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
