// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        // keep jitpack if project uses libraries hosted there
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    // WARNING: don't use 'project.ext' because IDE 'Cannot infer argument type'
    // https://stackoverflow.com/questions/20404476/how-to-define-common-android-properties-for-all-modules-using-gradle
    // Gradle constants example: https://github.com/google/ExoPlayer
    ext {
        // SDK / build tools
        compileSdkVersion = 28
        buildToolsVersion = "28.0.3"
        minSdkVersion = 14
        targetSdkVersion = 26

        // Fallback dependency versions (used when SharedModules/constants.gradle is missing)
        // These are conservative, widely compatible values. Override them in SharedModules/constants.gradle when available.
        espressoCoreVersion = '3.0.2'
        junitVersion = '4.12'
        robolectricVersion = '4.3'
        appCompatXLibraryVersion = '1.1.0'
        okhttpVersion = '3.12.1'
        ottoVersion = '1.3.8'
        dnsjavaVersion = '2.1.9'
        gsonVersion = '2.8.6'
        multiDexVersion = '1.0.3'
        diskLruCacheVersion = '2.0.2'

        // Crosswalk fallbacks (if you later decide to re-enable Crosswalk, update these)
        xwalkSharedLibraryVersion = '23.53.589.4'
        xwalkCoreLibraryVersion = '23.53.589.4'

        // Media/Player libs (these are placeholders - modules may override)
        media3Version = '1.4.0'
    }
}

allprojects {
    repositories {
        // Primary repositories for dependencies
        google()
        mavenCentral()
        // Keep jitpack if the project uses it
        maven { url 'https://jitpack.io' }

        // Crosswalk repo (optional) - uncomment only if you need Crosswalk AARs
        // maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
