// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        jcenter()
        mavenCentral()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'
    }

    // Common android config
    ext {
        compileSdkVersion = 28
        buildToolsVersion = "28.0.3"
        minSdkVersion = 14
        targetSdkVersion = 26
    }
}

// Centralized dependency versions (all modules read from rootProject.ext)
ext {
    // AndroidX / Support
    appCompatXLibraryVersion = '1.1.0'
    materialLibraryVersion   = '1.1.0'
    multiDexVersion          = '1.0.3'

    // Test
    junitVersion        = '4.12'
    espressoCoreVersion = '3.0.2'
    robolectricVersion  = '4.3.1'
    assertJVersion      = '3.12.2'
    commonsIOVersion    = '2.6'

    // Network / Util
    okhttpVersion       = '3.12.13'
    ottoVersion         = '1.3.8'
    dnsjavaVersion      = '3.5.2'
    gsonVersion         = '2.8.9'
    diskLruCacheVersion = '2.0.2'
    apacheCommonsLangVersion = '3.9'
    jsonPathVersion     = '2.4.0'

    // Crosswalk
    xwalkSharedLibraryVersion = '23.53.589.4'
    xwalkCoreLibraryVersion   = '23.53.589.4'

    // Other libs used in app / exoplayeractivity module
    nanoHttpdVersion         = '2.3.1'
    voiceOverlayVersion      = '1.0.0'
    constraintLayoutXVersion = '1.1.3'
    firebaseCrashlyticsVersion = '17.0.0'

    // ExoPlayer family (pick Amazon or Google)
    amazonExoplayerVersion      = '2.12.1'   // 示例版本，可按需调整
    exoplayerVersion            = '2.12.1'   // 如切换官方 ExoPlayer 时使用

    // PreviewSeekBar / Glide
    previewSeekBarDevVersion    = 'v3.2.2'
    previewSeekBarExoDevVersion = 'v3.2.2'
    glideVersion                = '4.11.0'
}

allprojects {
    repositories {
        jcenter()
        mavenCentral()
        google()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
        maven { url 'https://jitpack.io' }
        //flatDir { dirs 'libs' }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
