// Root build (migrated for AGP 8 / Gradle 8)

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'
    }
}

ext {
    // Toolchain targets
    compileSdkVersion = 34
    buildToolsVersion = "34.0.0"
    minSdkVersion = 22
    targetSdkVersion = 34

    // AndroidX / Support
    appCompatXLibraryVersion = '1.1.0'
    materialLibraryVersion   = '1.1.0'
    multiDexVersion          = '2.0.1'

    // Test
    junitVersion        = '4.12'
    espressoCoreVersion = '3.0.2'
    robolectricVersion  = '4.3.1'
    assertJVersion      = '3.12.2'
    commonsIOVersion    = '2.6'

    // Network / Util
    okhttpVersion       = '3.12.13'
    ottoVersion         = '1.3.8'
    dnsjavaVersion      = '3.5.2'
    gsonVersion         = '2.8.9'
    diskLruCacheVersion = '2.0.2'
    apacheCommonsLangVersion = '3.9'
    jsonPathVersion     = '2.4.0'

    // Crosswalk (保留如需)
    xwalkSharedLibraryVersion = '23.53.589.4'
    xwalkCoreLibraryVersion   = '23.53.589.4'

    // Media3 BOM（替代原 exoplayerVersion）
    media3BomVersion = '1.4.1'

    // 可选：集中管理常用 AndroidX 组件版本（已在各模块使用）
    // constraintLayoutVersion = '2.1.4'
    // recyclerViewVersion     = '1.3.2'
    // mediaVersion            = '1.6.0'
    // collectionVersion       = '1.2.0'
    // nanoHttpdVersion        = '2.3.1'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter 已關閉，僅當必要時保留來源鏡像
        maven { url 'https://maven.google.com/'; name 'Google' }
        maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
        maven { url 'https://jitpack.io' }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

task clean(type: Delete) { delete rootProject.buildDir }
