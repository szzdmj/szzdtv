// Update the repositories in the root build.gradle: ensure mavenCentral() + google() are present
allprojects {
    repositories {
        // keep jcenter() only if required by legacy deps (optional)
        jcenter()
        google()
        mavenCentral()

        // Crosswalk repo (optional) - keep commented unless you need the Crosswalk AARs
        // maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }

        // jitpack if you use it
        maven { url 'https://jitpack.io' }
    }

    // keep other existing configuration (compiler args, etc.)
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
