// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.4.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'com.android.library' version '8.4.2' apply false
}

allprojects {
    // repositories {  // Removed - configured in settings.gradle
    //     google()
    //     mavenCentral()
    //     maven { url 'https://jitpack.io' }
    // }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    compileSdkVersion = 34
    buildToolsVersion = '34.0.0'
    minSdkVersion = 22
    targetSdkVersion = 34
    appCompatXLibraryVersion = '1.6.1'
    glideVersion = '4.16.0'
    gsonVersion = '2.10.1'
    jsonPathVersion = '2.8.0'
    ottoVersion = '1.3.8'
    diskLruCacheVersion = '2.0.2'
    apacheCommonsLangVersion = '3.14.0'
    okhttpVersion = '4.11.0'
    multiDexVersion = '2.0.1'
    nanoHttpdVersion = '2.3.1'
    espressoCoreVersion = '3.5.1'
    junitVersion = '4.13.2'
    dnsjavaVersion = '3.5.1'
    robolectricVersion = '4.11.1'
}
