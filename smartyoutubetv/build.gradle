buildscript {
    repositories {
        jcenter()
        google()
    }

    dependencies {
        // Google Services / Crashlytics plugins (commented by default below)
        classpath 'com.google.gms:google-services:4.3.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.1.1'
    }
}

apply plugin: 'com.android.application'

// // Apply Google Services & Crashlytics if needed
// apply plugin: 'com.google.gms.google-services'
// apply plugin: 'com.google.firebase.crashlytics'

android {
    // FIX: Default interface methods are only supported starting with Android N (--min-api 24)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    compileSdkVersion project.properties.compileSdkVersion
    buildToolsVersion project.properties.buildToolsVersion
    testOptions.unitTests.includeAndroidResources = true

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion
        targetSdkVersion project.properties.targetSdkVersion
        applicationId "com.liskovsoft.videomanager"
        versionCode 1319
        versionName "6.17.739"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"

        // More info: http://myhexaville.com/2017/03/10/android-multidex/
        multiDexEnabled = true
    }

    buildTypes {
        // NOTE: to enable Crashlytics add fabric.properties file with your api keys
        Boolean crashEnabled = file('fabric.properties').exists()

        debug {
            buildConfigField "boolean", "CRASHLYTICS_ENABLED", crashEnabled.toString()
            ext.enableCrashlytics = crashEnabled
        }

        release {
            buildConfigField "boolean", "CRASHLYTICS_ENABLED", crashEnabled.toString()
            ext.enableCrashlytics = crashEnabled

            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //signingConfig signingConfigs.release
        }
    }

    // gradle 4.6 migration: disable dimensions mechanism
    flavorDimensions "default"

    productFlavors {
        orig { matchingFallbacks = ['lite'] }
        beta {
            matchingFallbacks = ['lite']
            applicationIdSuffix ".beta"
        }
        kids {
            matchingFallbacks = ['kids', 'lite']
            applicationIdSuffix ".kids"
        }
        Vlive {
            matchingFallbacks = ['lite']
            applicationIdSuffix ".live"
        }
        Vbolshoetv {
            matchingFallbacks = ['lite']
            versionCode 9400 + defaultConfig.versionCode
        }
        Vbolshoetv2 {
            matchingFallbacks = ['full']
            versionCode 9400 + defaultConfig.versionCode
            ndk { abiFilters "armeabi-v7a", "" }
        }
        Vrtarmenia2 {
            matchingFallbacks = ['lite']
            versionCode 9400 + defaultConfig.versionCode
            applicationId "com.google.android.youtube.tv"
        }
        Vredboxtv {
            matchingFallbacks = ['lite']
            versionCode 9400 + defaultConfig.versionCode
            applicationId "com.redboxtv.smartyoutubetv"
        }
    }

    // naming example: SYTV_Flavor_v6.8.12_r.apk
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def projectName = "SYTV"
            def flavor = variant.productFlavors[-1].name.capitalize()
            def buildType = variant.variantData.variantConfiguration.buildType.name.take(1)
            def version = variant.versionName

            def newApkName = sprintf("%s_%s_v%s_%s.apk", [projectName, flavor, version, buildType])
            output.outputFileName = new File(newApkName)
        }
    }

    lintOptions {
        abortOnError true
        lintConfig rootProject.file('lint.xml')
    }

    // FIX: Product Flavor duplicate classes — route common sources
    sourceSets {
        def commonDirs = ['src/commonSrc/appWatcher/java', 'src/commonSrc/crashHandler/java']
        def bolshoetvCommonDirs = ['src/commonSrc/Vbolshoetv/java']
        orig { java.srcDirs('src/commonSrc/crashHandler/java') }
        beta { java.srcDirs('src/commonSrc/crashHandler/java') }
        kids { java.srcDirs = commonDirs }
        Vlive { java.srcDirs = commonDirs }
        Vrtarmenia2 { java.srcDirs = commonDirs }
        Vredboxtv { java.srcDirs = commonDirs }
        Vbolshoetv { java.srcDirs = bolshoetvCommonDirs }
        Vbolshoetv2 { java.srcDirs = bolshoetvCommonDirs }
    }
}

dependencies {
    androidTestImplementation('com.android.support.test.espresso:espresso-core:' + rootProject.ext.espressoCoreVersion) {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    testImplementation 'junit:junit:' + rootProject.ext.junitVersion
    testImplementation 'org.assertj:assertj-core:' + rootProject.ext.assertJVersion
    testImplementation 'org.robolectric:robolectric:' + rootProject.ext.robolectricVersion
    testImplementation 'commons-io:commons-io:' + rootProject.ext.commonsIOVersion

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Common routines
    testImplementation project(path: ':sharedtests')
    implementation project(path: ':sharedutils')

    implementation project(path: ':common')
    implementation project(path: ':browser')
    implementation project(path: ':exoplayeractivity')
    implementation project(path: ':appupdatechecker')

    // Firebase Crashlytics SDK (only for beta flavor if enabled)
    betaImplementation('com.google.firebase:firebase-crashlytics:' + rootProject.ext.firebaseCrashlyticsVersion) {
        transitive = true
    }

    implementation 'androidx.appcompat:appcompat:' + rootProject.ext.appCompatXLibraryVersion
    implementation 'androidx.media:media:' + rootProject.ext.appCompatXLibraryVersion       // exoplayer fix
    implementation 'androidx.recyclerview:recyclerview:' + rootProject.ext.appCompatXLibraryVersion // exoplayer fix
    implementation 'androidx.constraintlayout:constraintlayout:' + rootProject.ext.constraintLayoutXVersion

    implementation 'com.google.code.gson:gson:' + rootProject.ext.gsonVersion
    implementation 'com.jayway.jsonpath:json-path:' + rootProject.ext.jsonPathVersion

    implementation 'org.nanohttpd:nanohttpd:' + rootProject.ext.nanoHttpdVersion
    implementation 'com.algolia.instantsearch:voice:' + rootProject.ext.voiceOverlayVersion

    implementation 'com.squareup.okhttp3:okhttp:' + rootProject.ext.okhttpVersion
    implementation 'com.squareup:otto:' + rootProject.ext.ottoVersion

    implementation 'com.jakewharton:disklrucache:' + rootProject.ext.diskLruCacheVersion

    implementation 'org.apache.commons:commons-lang3:' + rootProject.ext.apacheCommonsLangVersion
}
