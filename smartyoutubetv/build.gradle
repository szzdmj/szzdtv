apply plugin: 'com.android.application'

android {
    namespace 'szzdtv.smartyoutubetv'
    compileSdk 34

    defaultConfig {
        applicationId "szzdtv.smartyoutubetv"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "default"
    productFlavors {
        kids { dimension "default" }
        full { dimension "default" }
        lite { dimension "default" }
    }
}

// keep generateEmptyManifest, tasks, and dependencies as-is
dependencies {
   implementation project(':common')
   implementation 'androidx.appcompat:appcompat:1.6.1'

    // JSON parsing used by JsonInfoParser / JsonNextParser
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.jayway.jsonpath:json-path:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
