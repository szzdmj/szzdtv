apply plugin: 'com.android.application'

android {
    namespace 'szzdtv.smartyoutubetv'
    compileSdk 34

    defaultConfig {
        applicationId "szzdtv.smartyoutubetv"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "default"
    productFlavors {
        kids { dimension "default" }
        full { dimension "default" }
        lite { dimension "default" }
    }

    // TEMPORARY: exclude large legacy/optional packages so CI compiles only the
    // minimal surface we need for the PlayerActivity + WebView interception.
    // Keep excluded list conservative; do NOT exclude:
    //  - com/liskovsoft/smartyoutubetv/player/**      (our PlayerActivity)
    //  - com/liskovsoft/smartyoutubetv/web/**         (OpenLinkWebViewClient)
    // Add more excludes only as CI shows additional legacy packages to skip.
    sourceSets {
        main {
            java {
                exclude 'com/liskovsoft/smartyoutubetv/misc/**'
                exclude 'com/liskovsoft/smartyoutubetv/bootstrap/**'
                exclude 'com/liskovsoft/smartyoutubetv/voicesearch/**'
                exclude 'com/liskovsoft/smartyoutubetv/oldyoutubeinfoparser/**'
                exclude 'com/liskovsoft/smartyoutubetv/fragments/**'
                exclude 'com/liskovsoft/smartyoutubetv/keytranslator/**'
                exclude 'com/liskovsoft/smartyoutubetv/dialogtweaks/**'
                exclude 'com/liskovsoft/smartyoutubetv/interceptors/**'
                exclude 'com/liskovsoft/smartyoutubetv/webscripts/**'
                exclude 'com/liskovsoft/smartyoutubetv/receivers/**'
                exclude 'com/liskovsoft/smartyoutubetv/flavors/**' // exclude all flavors to avoid exoplayer legacy paths
                // note: do NOT exclude player/ and web/ packages (they are outside flavors/)
            }
        }
    }
}

def manifestRelative = 'src/main/AndroidManifest.xml'

tasks.register('generateEmptyManifest') { t ->
    outputs.file("$projectDir/${manifestRelative}")
    doLast {
        def manifestFile = new File(t.project.projectDir, manifestRelative)
        if (!manifestFile.exists()) {
            manifestFile.parentFile.mkdirs()
            manifestFile.text = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
</manifest>'''
            println "Created empty manifest at ${manifestFile}"
        } else {
            println "Manifest already exists at ${manifestFile}"
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach { it.dependsOn tasks.named('generateEmptyManifest') }

dependencies {
   implementation project(':common')
   implementation 'androidx.appcompat:appcompat:1.6.1'
   implementation 'androidx.core:core-ktx:1.10.1'

    // JSON parsing used by JsonInfoParser / JsonNextParser (kept)
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.jayway.jsonpath:json-path:2.7.0'

    // Networking used by Player+helpers
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // media3 for the lightweight PlayerActivity
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-ui:1.1.1'
    implementation 'androidx.media3:media3-common:1.1.1'
}
