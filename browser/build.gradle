apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android' // 如果你项目用旧 id，也可改成 'kotlin-android'

android {
    // 把这里的 namespace 改成你模块期望的包名（或与之前 manifest 中的 package 保持一致）
    namespace 'com.liskovsoft.browser'
    compileSdk = 34

    defaultConfig {
        minSdk = 22
        targetSdk = 34
        // 关键修复：当被依赖的模块（:common、:smartyoutubetv）含 productFlavors 时，
        // 通过 missingDimensionStrategy 指定要选用的 flavor，避免 Gradle 的 variant ambiguity。
        // 我这里默认选择 'full'，如需使用 'kids' 或 'lite' 请改成相应值。
        missingDimensionStrategy 'default', 'full'
        // 如果使用 root ext/vars，例如 rootProject.ext.minSdk，请替换成相应变量
        // minSdk = rootProject.ext.minSdk
        // targetSdk = rootProject.ext.targetSdk
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // 如有需要把 consumer proguard 或 buildTypes/sourceSets 放回去
    // consumerProguardFiles 'consumer-rules.pro'
}

dependencies {
    // 如果这些内部模块名不同，请改成你仓库里对应的 project(':...') 名称
    implementation project(':common')
    implementation project(':smartyoutubetv')

    // 基础 AndroidX / 常用库（按需要调整版本）
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.0'
    implementation 'com.squareup:otto:1.3.8'
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-ui:1.1.1'

    // 根据后续编译错误再逐一补充其它第三方依赖（okhttp, gson, exoplayer extras 等）
}
