apply plugin: 'com.android.library'

android {
    // 按需修改 namespace
    namespace 'szzdtv.browser'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    // 确保声明 flavorDimension & 三个 flavor（包含 smartyoutubetv 需要的 kids）
    flavorDimensions "default"
    productFlavors {
        kids { dimension "default" }
        full { dimension "default" }
        lite { dimension "default" }
    }

    // 保持最小化（空模块用于调试），不添加实现内容
}

// 任务：在构建开始前确保存在一个最小的 AndroidManifest（单文件调试用）
task generateEmptyManifest {
    doLast {
        def manifestFile = file("src/main/AndroidManifest.xml")
        if (!manifestFile.exists()) {
            manifestFile.parentFile.mkdirs()
            manifestFile.text = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="szzdtv.browser">
</manifest>'''
            println "Created empty manifest at ${manifestFile}"
        }
    }
}

// 把生成 manifest 的任务挂到预构建阶段，兼容不同 AGP 任务命名
afterEvaluate {
    if (project.tasks.findByName("preBuild") != null) {
        preBuild.dependsOn generateEmptyManifest
    } else {
        tasks.matching { it.name.endsWith("PreBuild") }.all { it.dependsOn generateEmptyManifest }
    }
}
