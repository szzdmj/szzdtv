// ref: 0104a6115380c2e97a6b272d928a0256c03edd57
// Top-level build file

buildscript {
    repositories {
        jcenter()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'
    }
    ext {
        compileSdkVersion = 28
        buildToolsVersion = "28.0.3"
        minSdkVersion = 14
        targetSdkVersion = 26
    }
}

// 统一版本常量（原 constants.gradle 内容搬运至此）
ext {
    // AndroidX / Support
    appCompatXLibraryVersion = '1.1.0'
    materialLibraryVersion   = '1.1.0'
    multiDexVersion          = '1.0.3'          // 仍有 legacy 使用 com.android.support:multidex

    // Test
    junitVersion        = '4.12'
    espressoCoreVersion = '3.0.2'
    robolectricVersion  = '4.3.1'

    // Network / Util
    okhttpVersion       = '3.12.13'
    ottoVersion         = '1.3.8'
    dnsjavaVersion      = '3.5.2'
    gsonVersion         = '2.8.9'
    diskLruCacheVersion = '2.0.2'

    // Crosswalk
    xwalkSharedLibraryVersion = '23.53.589.4'
    xwalkCoreLibraryVersion   = '23.53.589.4'
}

allprojects {
    repositories {
        jcenter()
        google()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
        maven { url 'https://jitpack.io' }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
