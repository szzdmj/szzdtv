apply plugin: 'com.android.library'

android {
    // Default interface methods need Java 8
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    compileSdkVersion project.properties.compileSdkVersion
    buildToolsVersion project.properties.buildToolsVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion
        targetSdkVersion project.properties.targetSdkVersion
        versionCode 7
        versionName "6.4.7"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // 单一维度，提供 lite/full 两种口味
    flavorDimensions "default"
    productFlavors {
        lite {}
        full {}
    }

    // 关键：发布 liteDebug 变体，避免解析到 full 变体
    defaultPublishConfig "liteDebug"

    lintOptions {
        abortOnError true
        lintConfig rootProject.file('lint.xml')
    }
}

dependencies {
    // tests
    androidTestImplementation('com.android.support.test.espresso:espresso-core:' + rootProject.ext.espressoCoreVersion) {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    testImplementation 'junit:junit:' + rootProject.ext.junitVersion

    // core
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:' + rootProject.ext.appCompatXLibraryVersion
    implementation 'com.squareup.okhttp3:okhttp:' + rootProject.ext.okhttpVersion
    implementation 'com.squareup:otto:' + rootProject.ext.ottoVersion
    implementation 'dnsjava:dnsjava:' + rootProject.ext.dnsjavaVersion

    implementation project(path: ':sharedutils')
    implementation project(path: ':common')
    implementation project(path: ':appupdatechecker')

    // 仅启用 lite 口味的 Crosswalk，防止触发 full 口味任务
    liteImplementation 'org.xwalk:xwalk_shared_library:' + rootProject.ext.xwalkSharedLibraryVersion
    // 如需 full 再打开下面一行，并确保依赖可解析
    // fullImplementation 'org.xwalk:xwalk_core_library:' + rootProject.ext.xwalkCoreLibraryVersion
}
