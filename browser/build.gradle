apply plugin: 'com.android.library'

android {
    namespace 'szzdtv.browser'
    namespace 'com.liskovsoft.browser'
    compileSdk 34
    defaultConfig {
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "default"
    productFlavors {
        kids { dimension "default" }
        full { dimension "default" }
        lite { dimension "default" }
    }
}

def manifestRelative = 'src/main/AndroidManifest.xml'

// 使用 project.projectDir（已经是 java.io.File）或 project.layout.projectDirectory.asFile（Provider -> File）
// 注意不要对 File 再调用 .get()
def projectDirFile = project.projectDir

tasks.register('generateEmptyManifest') { t ->
    // outputs 使用一个 File 实例，不要传 Provider.get() 导致错误
    outputs.file(new File(projectDirFile, manifestRelative))

    doLast {
        def manifestFile = new File(projectDirFile, manifestRelative)
        if (!manifestFile.exists()) {
            manifestFile.parentFile.mkdirs()
            manifestFile.text = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android"
          package="szzdtv.browser">
</manifest>'''
            println "Created empty manifest at ${manifestFile}"
        } else {
            println "Manifest already exists at ${manifestFile}"
        }
    }
}

// 以 configuration-cache 友好的方式把 generateEmptyManifest 绑定到 preBuild（若存在）
tasks.matching { it.name == 'preBuild' }.configureEach { it.dependsOn tasks.named('generateEmptyManifest') }
