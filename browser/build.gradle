android {
    namespace 'com.liskovsoft.browser' // 把原来 manifest 的 package 映射过来
    compileSdk 34

    defaultConfig {
        minSdk 22
        targetSdk 34
        // 如果你用 root ext（如 ext.minSdk 等），可以用那边的变量： minSdk ext.minSdk
    }

    // ... 保留原来的配置（buildTypes, sourceSets 等）
}

dependencies {
    // 内部模块（请确认 settings.gradle 中包含 ':common' ':smartyoutubetv' 等）
    implementation project(':common')
    implementation project(':smartyoutubetv')

    // AndroidX / 常见运行时库（按需调整版本）
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.0'
    implementation 'androidx.viewpager:viewpager:1.0.0' // 如果代码用到 viewpager
    implementation 'com.squareup:otto:1.3.8' // 如果代码用到 Otto 的 @Subscribe
    // media3 / ExoPlayer（如果代码用到了 androidx.media3）
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-ui:1.1.1'

    // 其它第三方库（根据编译错误逐个补）
    // implementation 'com.squareup.okhttp3:okhttp:4.10.0'
}
