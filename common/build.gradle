apply plugin: 'com.android.library'

android {
    // FIX: Default interface methods are only supported starting with Android N (--min-api 24)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    compileSdkVersion project.properties.compileSdkVersion
    buildToolsVersion project.properties.buildToolsVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion
        targetSdkVersion project.properties.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError true
        lintConfig rootProject.file('lint.xml')
    }
}

dependencies {
    androidTestImplementation('com.android.support.test.espresso:espresso-core:' + rootProject.ext.espressoCoreVersion) {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    testImplementation 'junit:junit:' + rootProject.ext.junitVersion
    testImplementation 'org.robolectric:robolectric:' + rootProject.ext.robolectricVersion

    implementation project(path: ':sharedutils')

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:' + rootProject.ext.appCompatXLibraryVersion

    implementation 'com.squareup:otto:' + rootProject.ext.ottoVersion
    implementation 'com.squareup.okhttp3:okhttp:' + rootProject.ext.okhttpVersion

    implementation 'com.google.code.gson:gson:' + rootProject.ext.gsonVersion

    implementation 'com.android.support:multidex:' + rootProject.ext.multiDexVersion
    implementation 'com.jakewharton:disklrucache:' + rootProject.ext.diskLruCacheVersion
}
