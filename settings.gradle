// Modern settings.gradle with centralized dependencyResolutionManagement (Gradle 7+/8+)
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Uncomment if Crosswalk artifacts are needed:
        // maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
    }
}

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

rootProject.name = 'szzdtv'
include ':smartyoutubetv', ':browser', ':exoplayeractivity', ':appupdatechecker', ':common'

// Optional: try to apply SharedModules/core_settings.gradle if present (non-fatal)
def sharedRoot = new File(settingsDir, '../SharedModules').exists() ? new File(settingsDir, '../SharedModules') : new File(settingsDir, './SharedModules')
def coreSettingsFile = new File(sharedRoot, 'core_settings.gradle')
if (coreSettingsFile.exists()) {
    apply from: coreSettingsFile
} else {
    println "Info: SharedModules/core_settings.gradle not present at ${sharedRoot}; continuing without it."
}
