// 仅包含项目内实际存在的模块（补上 :sharedutils）
include ':smartyoutubetv', ':browser', ':exoplayeractivity', ':appupdatechecker', ':common', ':sharedutils'

// 可选引入外部子模块（存在才应用），避免因缺失文件导致失败
def rootDir = settingsDir
def tryApply = { baseName ->
    def root = new File(rootDir, "../${baseName}").exists() ? new File(rootDir, "../${baseName}") : new File(rootDir, "./${baseName}")
    def core = new File(root, 'core_settings.gradle')
    if (core.exists()) {
        apply from: core
        println "INFO: Applied ${core}"
    } else {
        println "WARN: ${baseName} core_settings.gradle not found at ${core}, skipping."
    }
}
tryApply('SharedModules')
tryApply('MediaServiceCore')

