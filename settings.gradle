// Modern settings.gradle with pluginManagement first (required by Gradle)
// Then dependencyResolutionManagement and module includes.
// Try to apply SharedModules/core_settings.gradle if present (non-fatal).

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Uncomment if Crosswalk artifacts are needed:
        // maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
    }
}

rootProject.name = 'szzdtv'

// existing includes...
include ':smartyoutubetv'
include ':exoplayeractivity'
include ':common' // <- ensure common is included

// if common lives at ./common (default), no extra config needed.
// If different path, add:
// project(':common').projectDir = file('common')
// NOTE: removed unconditional include(...) lines.
// Use includeIfExists to avoid registering projects whose directories are missing
def sharedRoot = new File(settingsDir, '../SharedModules').exists() ? new File(settingsDir, '../SharedModules') : new File(settingsDir, './SharedModules')
def coreSettingsFile = new File(sharedRoot, 'core_settings.gradle')

// helper: include only if the physical directory exists
def includeIfExists = { String projectPath, String physicalDir ->
    if (file(physicalDir).exists()) {
        include projectPath
    } else {
        println "Info: project directory '${physicalDir}' not found; skipping include of ${projectPath}."
    }
}

// Include modules only when their directories are present
includeIfExists(':browser', 'browser')
includeIfExists(':common', 'common')
includeIfExists(':exoplayeractivity', 'exoplayeractivity')
includeIfExists(':smartyoutubetv', 'smartyoutubetv')
includeIfExists(':appupdatechecker', 'appupdatechecker')

// Optional: try to apply SharedModules/core_settings.gradle if present (non-fatal)
if (coreSettingsFile.exists()) {
    apply from: coreSettingsFile
} else {
    println "Info: SharedModules/core_settings.gradle not found; skipping."
}
