 url=https://github.com/szzdmj/szzdtv/blob/495b708e9cf71359d7a3e3aac914abbbb3d5da10/settings.gradle
// Use settings.gradle to configure repositories centrally (Gradle 7+ recommendation)
// and to prefer settings repositories over project repositories.

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // Prevent project build files from declaring repositories
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        // Primary repositories for dependencies
        google()
        mavenCentral()
        // keep jitpack if the project uses it
        maven { url 'https://jitpack.io' }

        // Crosswalk repo (optional, uncomment only if you need Crosswalk AARs)
        // maven { url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2' }
    }
}

// Module includes (kept from original upstream layout)
include ':smartyoutubetv', ':browser', ':exoplayeractivity', ':appupdatechecker', ':common'

def rootDir = settingsDir

// prepare to git submodule
gradle.ext.sharedModulesRoot = new File(rootDir, '../SharedModules').exists() ? new File(rootDir, '../SharedModules') : new File(rootDir, './SharedModules')
apply from: new File(gradle.ext.sharedModulesRoot, 'core_settings.gradle')

gradle.ext.sharedModulesConstants = new File(gradle.ext.sharedModulesRoot, 'constants.gradle')

// prepare to git submodule
gradle.ext.mediaServiceCoreRoot = new File(rootDir, '../MediaServiceCore').exists() ? new File(rootDir, '../MediaServiceCore') : new File(rootDir, './MediaServiceCore')
apply from: new File(gradle.ext.mediaServiceCoreRoot, 'core_settings.gradle')
