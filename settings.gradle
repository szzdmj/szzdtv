// Minimal, resilient settings.gradle
// - Keeps pluginManagement repositories so Gradle can resolve plugins
// - Includes project modules
// - Safely applies SharedModules/core_settings.gradle and MediaServiceCore/core_settings.gradle only if they exist
// This file intentionally avoids dependencyResolutionManagement to maximize compatibility with older Gradle versions.
// If you want centralized repositories for newer Gradle, we can add dependencyResolutionManagement later.

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

include ':smartyoutubetv', ':browser', ':exoplayeractivity', ':appupdatechecker', ':common'

def rootDir = settingsDir

// SharedModules (try ../SharedModules first, then ./SharedModules)
gradle.ext.sharedModulesRoot = new File(rootDir, '../SharedModules').exists() ?
        new File(rootDir, '../SharedModules') : new File(rootDir, './SharedModules')

def coreSettings = new File(gradle.ext.sharedModulesRoot, 'core_settings.gradle')
if (coreSettings.exists()) {
    apply from: coreSettings
} else {
    println "Info: SharedModules/core_settings.gradle not found at ${gradle.ext.sharedModulesRoot}. Skipping apply."
}

// Expose constants file location if it exists (some builds rely on this variable)
def constantsFile = new File(gradle.ext.sharedModulesRoot, 'constants.gradle')
if (constantsFile.exists()) {
    gradle.ext.sharedModulesConstants = constantsFile
} else {
    println "Info: SharedModules/constants.gradle not found at ${gradle.ext.sharedModulesRoot}."
}

// MediaServiceCore (optional submodule)
gradle.ext.mediaServiceCoreRoot = new File(rootDir, '../MediaServiceCore').exists() ?
        new File(rootDir, '../MediaServiceCore') : new File(rootDir, './MediaServiceCore')

def mediaCoreSettings = new File(gradle.ext.mediaServiceCoreRoot, 'core_settings.gradle')
if (mediaCoreSettings.exists()) {
    apply from: mediaCoreSettings
} else {
    println "Info: MediaServiceCore/core_settings.gradle not found at ${gradle.ext.mediaServiceCoreRoot}. Skipping apply."
}
