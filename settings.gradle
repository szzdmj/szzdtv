// 仅包含实际存在的模块
include ':smartyoutubetv', ':browser', ':exoplayeractivity', ':appupdatechecker', ':common'

def rootDir = settingsDir

// SharedModules
gradle.ext.sharedModulesRoot = new File(rootDir, '../SharedModules').exists()
        ? new File(rootDir, '../SharedModules')
        : new File(rootDir, './SharedModules')
def sharedCore = new File(gradle.ext.sharedModulesRoot, 'core_settings.gradle')
if (sharedCore.exists()) {
    apply from: sharedCore
} else {
    println "WARN: SharedModules core_settings not found at ${sharedCore}. Skipping."
}
gradle.ext.sharedModulesConstants = new File(gradle.ext.sharedModulesRoot, 'constants.gradle')

// MediaServiceCore（存在才引入）
gradle.ext.mediaServiceCoreRoot = new File(rootDir, '../MediaServiceCore').exists()
        ? new File(rootDir, '../MediaServiceCore')
        : new File(rootDir, './MediaServiceCore')
def mediaCore = new File(gradle.ext.mediaServiceCoreRoot, 'core_settings.gradle')
if (mediaCore.exists()) {
    apply from: mediaCore
} else {
    println "WARN: MediaServiceCore core_settings not found at ${mediaCore}. Skipping."
}
